[package]
name = "panopticon-hub"
version = "0.2.36"
edition = "2021"

[[bin]]
name = "PanopticonHub"
path = "src/main.rs"

[dependencies]
hub-backend = { path = "../backend" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
crc32fast = "1"
tempfile = "3"
libloading = "0.8"
rfd = { version = "0.15", default-features = false }
windows = { version = "0.61", features = ["Win32_UI_Shell","Win32_System_Com","Win32_Foundation","Win32_Storage_FileSystem","Win32_UI_WindowsAndMessaging","Win32_System_Com_StructuredStorage","Win32_System_Variant","Win32_UI_Shell_PropertiesSystem"] }
tray-icon = { version = "0.22", default-features = false }
tao = "0.37"
wry = { version = "0.57", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_System_Threading","Win32_Security","Win32_Storage_FileSystem","Win32_System_Com","Win32_UI_Controls_Dialogs","Win32_System_Console","Win32_Networking_WinHttp","Win32_Graphics_Gdi","Win32_System_JobObjects","Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"
